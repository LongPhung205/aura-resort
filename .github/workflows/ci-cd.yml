name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. BACKEND CI ─────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Java 17 & Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/booking_hotel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Unit & Integration Tests
        run: ./mvnw test

      - name: Package Spring Boot Application
        run: ./mvnw clean package -DskipTests

  # ─── 2. FRONTEND CI ────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 20 & Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Source Code
        run: npm run lint --if-present

      - name: Build Production Bundle
        run: npm run build -- --configuration production

  # ─── 3. DOCKER PUBLISH (GHCR) ──────────────────────────────────
  docker-publish:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert Repository Owner to Lowercase
        id: repo_meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "REPO_OWNER=${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/booking_hotel
          file: ./backend/booking_hotel/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner }}/aura-resort-backend:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner }}/aura-resort-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner }}/aura-resort-frontend:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner }}/aura-resort-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
