<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { height: 100%; font-family: sans-serif; }
.app-container { display: flex; height: 100vh; overflow: hidden; background: #f8fafc; }
.sidebar { width: 256px; background: white; border-right: 1px solid #e2e8f0; padding: 20px; transition: transform 0.3s; z-index: 50; }
.main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.header { height: 64px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 30; padding: 20px; }
.main-scroll { flex: 1; overflow-y: auto; background: #f8fafc; padding: 20px; }
.content-box { max-width: 1440px; margin: 0 auto; height: 1200px; background: #e0f2fe; padding: 20px; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background-color: rgba(2, 6, 23, 0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-box {
  position: relative; z-index: 10;
  background: white; border-radius: 24px; max-width: 768px; width: 100%;
  padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  height: 400px;
}
</style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar">
    <h2>Sidebar (Nav)</h2>
    <p>This is the sidebar menu that should be darkened/blurred when modal is open.</p>
  </aside>
  <div class="main-wrapper">
    <header class="header">
      <h2>Header Top Bar</h2>
    </header>
    <main class="main-scroll">
      <div class="content-box">
        <h1>Room Management Content</h1>
        <p>Lots of content here...</p>
        <div class="modal-overlay">
          <div class="modal-box">
            <h2>Khởi Tạo Biệt Thự Mới</h2>
            <p>Popup in the center</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
