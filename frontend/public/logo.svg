<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0ea5e9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background transparent -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Icon Emblem (Left) -->
  <g transform="translate(35, 10)">
    <!-- Outer delicate architectural diamond / shield -->
    <path d="M90 10 L165 90 L90 170 L15 90 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-dasharray="4 2" opacity="0.65"/>
    <circle cx="90" cy="90" r="74" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Stylized "A" + Luxury Villa roof silhouette & arches -->
    <path d="M90 26 L138 128 L120 128 L90 64 L60 128 L42 128 Z" fill="url(#primaryGrad)" filter="url(#subtleGlow)"/>

    <!-- Inner Villa Sanctuary Arch (Resort colonnade) -->
    <path d="M74 128 L74 100 C74 88 106 88 106 100 L106 128 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Gentle Ocean Wave horizon across base of villa -->
    <path d="M45 140 Q67.5 131 90 140 T135 140" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 151 Q74 144 90 151 T122 151" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- Royal Sun / Star atop villa apex -->
    <circle cx="90" cy="22" r="4.5" fill="url(#goldGrad)"/>
    <path d="M90 10 L90 15 M90 29 L90 34 M78 22 L83 22 M97 22 L102 22" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Divider line -->
  <line x1="230" y1="40" x2="230" y2="160" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Brand Typography (Right) -->
  <g transform="translate(265, 0)">
    <!-- Subtitle / Tagline Top -->
    <text x="4" y="68" font-family="'Roboto', 'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#64748b" text-transform="uppercase">
      LUXURY RESORT &amp; RESIDENCES
    </text>

    <!-- Main Brand Name: AURA + VILLAS -->
    <g transform="translate(0, 134)">
      <!-- AURA -->
      <text x="0" y="0" font-family="'Roboto', 'Cinzel', 'Playfair Display', sans-serif" font-size="64" font-weight="800" letter-spacing="6" fill="url(#accentGrad)">
        AURA
      </text>

      <!-- VILLAS -->
      <text x="245" y="0" font-family="'Roboto', 'Montserrat', sans-serif" font-size="64" font-weight="300" letter-spacing="8" fill="url(#goldGrad)">
        VILLAS
      </text>
    </g>

    <!-- Bottom Accent underline -->
    <rect x="4" y="152" width="460" height="2" fill="url(#goldGrad)" opacity="0.55" rx="1"/>
  </g>
</svg>