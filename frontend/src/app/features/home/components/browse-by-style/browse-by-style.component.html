<section class="py-12 bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-10 text-center sm:text-left">
      <h2 class="text-3xl sm:text-4xl font-black text-[#0369A1] uppercase tracking-wider mb-4">
        Phong Cách Nghỉ Dưỡng
      </h2>
      <p class="text-sm text-slate-500 font-bold max-w-2xl">Trải nghiệm phong cách nghỉ dưỡng phù hợp nhất với bạn</p>
    </div>

    <!-- Horizontal Scrollable Container -->
    <div class="flex overflow-x-auto pb-6 -mx-4 px-4 sm:mx-0 sm:px-0 space-x-4 hide-scrollbar snap-x snap-mandatory">
      
      <a *ngFor="let style of styles" 
         class="flex-shrink-0 w-48 sm:w-56 group cursor-pointer snap-start flex flex-col">
        
        <div class="w-full h-48 sm:h-56 rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow mb-3 relative bg-slate-200">
          <img [src]="style.image" 
               [alt]="style.name" 
               class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
        </div>
        
        <h3 class="text-slate-900 font-extrabold text-sm sm:text-base group-hover:text-[#0369A1] transition-colors leading-tight mb-1">{{ style.name }}</h3>
        <p class="text-slate-500 text-xs font-bold">{{ style.count }} chỗ nghỉ</p>
      </a>

    </div>
  </div>
</section>
