<section class="py-12 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-10">
      <h2 class="text-3xl sm:text-4xl font-black text-[#0369A1] uppercase tracking-wider mb-4">
        Khám Phá Phân Khu
      </h2>
      <p class="text-sm text-slate-500 font-bold max-w-2xl">Những lựa chọn phổ biến nhất dành cho du khách từ Việt Nam</p>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="loading" class="flex space-x-4 overflow-x-auto pb-4 hide-scrollbar">
      <div *ngFor="let item of [1,2,3,4]" class="flex-shrink-0 w-64 h-48 bg-slate-200 rounded-lg animate-pulse"></div>
    </div>

    <!-- Horizontal Scrollable Container -->
    <div *ngIf="!loading && zones.length > 0" class="flex overflow-x-auto pb-6 -mx-4 px-4 sm:mx-0 sm:px-0 space-x-4 hide-scrollbar snap-x snap-mandatory sm:justify-center">
      
      <a *ngFor="let zone of zones" 
         [routerLink]="['/villas/search']" 
         [queryParams]="{zone: zone.name}"
         class="flex-shrink-0 w-64 h-48 sm:w-72 sm:h-56 relative rounded-lg overflow-hidden group snap-start cursor-pointer border border-slate-200 shadow-sm hover:shadow-lg transition-shadow">
        
        <img [src]="getZoneImage(zone)" 
             [alt]="zone.name" 
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
        
        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent"></div>
        
        <!-- Text Content -->
        <div class="absolute bottom-4 left-4 right-4">
          <div class="flex items-center space-x-1.5 mb-1">
            <h3 class="text-white font-black text-lg sm:text-xl drop-shadow-md">Phân Khu {{ zone.name }}</h3>
          </div>
          <p class="text-slate-200 text-xs font-bold drop-shadow-sm line-clamp-1">{{ zone.description || 'Biệt thự cao cấp' }}</p>
        </div>
      </a>

    </div>
  </div>
</section>
