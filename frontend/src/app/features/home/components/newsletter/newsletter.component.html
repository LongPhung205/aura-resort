<section class="bg-white text-slate-800 py-16 lg:py-20 border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row items-center justify-between gap-8">
      
      <!-- Text -->
      <div class="max-w-xl space-y-2 text-center lg:text-left">
        <div class="inline-flex items-center text-[10px] sm:text-xs font-bold tracking-[0.15em] text-amber-900 uppercase">
          <span class="material-symbols-outlined text-[16px] text-amber-700 mr-1.5">mail</span>
          <span>ĐẶC QUYỀN DÀNH CHO BẠN</span>
        </div>
        <h3 class="text-2xl sm:text-3xl font-black text-slate-900">
          Đăng Ký Nhận Bản Tin Ưu Đãi VIP
        </h3>
        <p class="text-xs sm:text-sm text-slate-600 font-normal">
          Nhận thông tin sớm nhất về các chương trình ưu đãi độc quyền và tích luỹ điểm thưởng Aura Elite Club.
        </p>
      </div>

      <!-- Form Input & Submit -->
      <div class="w-full lg:w-auto flex-1 max-w-md">
        <form (ngSubmit)="onSubmit()" class="flex flex-col sm:flex-row items-center gap-2.5">
          <div class="relative w-full">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[18px] text-slate-400">mail</span>
            <input
              type="email"
              [(ngModel)]="email"
              name="newsletterEmail"
              placeholder="Nhập địa chỉ email của bạn tại đây..."
              required
              class="w-full pl-10 pr-4 py-3.5 rounded-xl text-xs font-medium border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#D4AF37] focus:ring-2 focus:ring-amber-200/50 transition"
            />
          </div>
          <button
            type="submit"
            class="w-full sm:w-auto flex-shrink-0 gold-button-vivid text-white px-7 py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider shadow-md flex items-center justify-center space-x-1.5"
          >
            <span class="material-symbols-outlined text-[16px]">send</span>
            <span>Đăng Ký</span>
          </button>
        </form>

        <div *ngIf="isSubscribed" class="mt-2.5 text-xs text-emerald-700 font-semibold animate-fade-in flex items-center space-x-1.5 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-200">
          <span class="material-symbols-outlined text-[16px] text-emerald-600">check_circle</span>
          <span>Cảm ơn bạn! Đã đăng ký nhận bản tin ưu đãi VIP thành công.</span>
        </div>
      </div>

    </div>
  </div>
</section>
