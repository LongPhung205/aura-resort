<section class="bg-white text-slate-800 py-20 lg:py-24 border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header -->
    <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-14 pb-5 border-b border-slate-200 gap-4">
      <div>
        <div class="inline-flex items-center text-xs font-bold tracking-[0.15em] text-amber-900 uppercase mb-2">
          <span class="material-symbols-outlined text-[16px] text-amber-700 mr-1.5">reviews</span>
          <span>TRẢI NGHIỆM KHÁCH HÀNG THỰC TẾ</span>
        </div>
        <h2 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
          Khách Hàng Nói Gì Về Aura
        </h2>
      </div>

      <div class="flex items-center space-x-2 text-xs text-slate-700 bg-amber-50 px-4 py-2 rounded-full border border-amber-200 shadow-sm font-medium">
        <span class="material-symbols-outlined text-[18px] text-amber-500">star</span>
        <span><strong class="text-slate-900 font-bold">99.4%</strong> Hài lòng trên TripAdvisor & Google Reviews</span>
      </div>
    </div>

    <!-- 3 Testimonial Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
      <div
        *ngFor="let item of testimonials"
        class="bg-gradient-to-b from-[#FFFDF9] to-[#FAF7F2] p-8 rounded-2xl border border-slate-200 border-t-4 border-t-[#D4AF37] shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between relative group"
      >
        <!-- Gold Stars with Material Symbols -->
        <div class="flex items-center space-x-0.5 text-amber-500 mb-5">
          <span class="material-symbols-outlined text-[18px]">star</span>
          <span class="material-symbols-outlined text-[18px]">star</span>
          <span class="material-symbols-outlined text-[18px]">star</span>
          <span class="material-symbols-outlined text-[18px]">star</span>
          <span class="material-symbols-outlined text-[18px]">star</span>
          <span class="text-xs text-amber-900 font-black ml-2 bg-amber-100/70 px-2 py-0.5 rounded-full">5.0</span>
        </div>

        <!-- Quote Text -->
        <p class="italic text-sm sm:text-base text-slate-800 leading-relaxed flex-grow mb-6 font-normal">
          {{ item.quote }}
        </p>

        <!-- Author Info -->
        <div class="flex items-center space-x-3.5 pt-5 border-t border-slate-200/80">
          <img
            [src]="item.avatarUrl"
            [alt]="item.authorName"
            class="w-12 h-12 rounded-full object-cover border-2 border-amber-400 shadow-md"
          />
          <div>
            <div class="flex items-center space-x-1">
              <h4 class="font-bold text-sm text-slate-900 group-hover:text-amber-900 transition">{{ item.authorName }}</h4>
              <span class="material-symbols-outlined text-[14px] text-emerald-600" title="Đã xác thực">verified</span>
            </div>
            <p class="text-xs text-slate-500 line-clamp-1 font-medium mt-0.5">{{ item.authorTitle }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Press & Awards Bar -->
    <div class="border-t border-slate-200 pt-10">
      <div class="text-center text-[11px] uppercase font-bold tracking-[0.2em] text-slate-400 mb-6">
        Được Vinh Danh & Bảo Chứng Bởi Các Tổ Chức Uy Tín Toàn Cầu
      </div>
      <div class="flex flex-wrap items-center justify-center gap-8 sm:gap-14 text-slate-500 tracking-[0.15em] text-xs sm:text-sm font-bold">
        <span *ngFor="let press of pressList" class="hover:text-slate-800 transition">
          {{ press }}
        </span>
      </div>
    </div>

  </div>
</section>
