<div id="booking-widget" class="relative z-20 -mt-16 sm:-mt-20 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
  <!-- Minimalist Luxury Search Bar (Vibrant) -->
  <div class="bg-white/95 backdrop-blur-xl shadow-2xl border-t-4 border-[#0284C7] rounded-sm overflow-visible p-3 sm:p-4 lg:p-5">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-4 lg:gap-0 items-center">
      
      <!-- Input 1: Destination (3 cols) -->
      <div class="lg:col-span-3 relative lg:border-r border-sky-100 pb-3 lg:pb-0 px-2 lg:px-6">
        <div class="flex items-center text-[11px] font-black tracking-widest text-[#0284C7] uppercase mb-1">
          <span class="material-symbols-outlined text-[16px] mr-1 text-[#EA580C]">location_on</span>
          <span>Phân Khu / Resort</span>
        </div>
        <button
          type="button"
          (click)="toggleDestinationDropdown()"
          class="w-full flex items-center justify-between cursor-pointer group text-left focus:outline-none hover:opacity-80 transition-opacity"
        >
          <div class="truncate">
            <div class="text-[16px] font-bold text-slate-900 group-hover:text-[#EA580C] transition-colors truncate tracking-wide">
              {{ selectedDestinationName }}
            </div>
            <div class="text-[12px] font-medium text-slate-500 truncate mt-0.5">Hệ thống Biệt thự nghỉ dưỡng cao cấp</div>
          </div>
          <span class="material-symbols-outlined text-[24px] text-[#0284C7] group-hover:text-[#EA580C] transition-colors flex-shrink-0">expand_more</span>
        </button>

        <!-- Destination Dropdown Menu -->
        <div
          *ngIf="isDestinationDropdownOpen"
          class="absolute left-0 top-full mt-6 w-80 max-h-80 overflow-y-auto bg-white shadow-2xl border-t-4 border-[#EA580C] z-50 py-3 animate-in fade-in slide-in-from-top-2 duration-200"
        >
          <button
            type="button"
            *ngFor="let dest of destinations"
            (click)="selectDestination(dest.id)"
            class="w-full px-6 py-3 hover:bg-sky-50 cursor-pointer transition text-left focus:outline-none group/item"
          >
            <div class="text-[15px] font-bold text-[#0369A1] group-hover/item:text-[#EA580C] transition-colors">{{ dest.name }}</div>
            <div class="text-[12px] font-medium text-slate-500 mt-0.5">{{ dest.sub }}</div>
          </button>
        </div>
      </div>

      <!-- Input 2: Dates (4 cols) -->
      <div class="lg:col-span-4 lg:border-r border-sky-100 pb-3 lg:pb-0 px-2 lg:px-6">
        <div class="flex items-center text-[11px] font-black tracking-widest text-[#0284C7] uppercase mb-1">
          <span class="material-symbols-outlined text-[16px] mr-1 text-[#EA580C]">calendar_month</span>
          <span>Nhận Phòng — Trả Phòng</span>
        </div>
        <div class="flex items-center space-x-3">
          <input
            type="date"
            [(ngModel)]="checkInDate"
            class="w-full text-[15px] font-bold text-slate-900 bg-transparent border-none p-0 focus:ring-0 cursor-pointer"
          />
          <span class="text-[#0284C7] font-black">—</span>
          <input
            type="date"
            [(ngModel)]="checkOutDate"
            class="w-full text-[15px] font-bold text-slate-900 bg-transparent border-none p-0 focus:ring-0 cursor-pointer"
          />
        </div>
      </div>

      <!-- Input 3: Guests & Rooms (3 cols) -->
      <div class="lg:col-span-3 relative pb-3 lg:pb-0 px-2 lg:px-6">
        <div class="flex items-center text-[11px] font-black tracking-widest text-[#0284C7] uppercase mb-1">
          <span class="material-symbols-outlined text-[16px] mr-1 text-[#EA580C]">group</span>
          <span>Số Khách & Phòng</span>
        </div>
        <button
          type="button"
          (click)="toggleGuestDropdown()"
          class="w-full flex items-center justify-between cursor-pointer group text-left focus:outline-none hover:opacity-80 transition-opacity"
        >
          <div>
            <div class="text-[16px] font-bold text-slate-900 group-hover:text-[#EA580C] transition-colors tracking-wide">
              {{ adults + children }} Khách, {{ rooms }} Phòng
            </div>
            <div class="text-[12px] font-medium text-slate-500 mt-0.5">
              {{ adults }} Người lớn, {{ children }} Trẻ em
            </div>
          </div>
          <span class="material-symbols-outlined text-[24px] text-[#0284C7] group-hover:text-[#EA580C] transition-colors flex-shrink-0">expand_more</span>
        </button>

        <!-- Guests Dropdown Popover -->
        <div
          *ngIf="isGuestDropdownOpen"
          class="absolute left-0 lg:left-auto lg:-right-4 top-full mt-6 w-80 bg-white shadow-2xl border-t-4 border-[#EA580C] z-50 p-6 space-y-6 animate-in fade-in slide-in-from-top-2 duration-200"
        >
          <!-- Adults -->
          <div class="flex items-center justify-between">
            <div>
              <div class="text-[14px] font-black text-[#0369A1] tracking-wider">Người Lớn</div>
              <div class="text-[12px] font-medium text-slate-500 mt-0.5">Từ 12 tuổi trở lên</div>
            </div>
            <div class="flex items-center space-x-4">
              <button (click)="updateCount('adults', -1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">remove</span>
              </button>
              <span class="text-[16px] font-black w-4 text-center text-slate-900">{{ adults }}</span>
              <button (click)="updateCount('adults', 1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">add</span>
              </button>
            </div>
          </div>

          <!-- Children -->
          <div class="flex items-center justify-between">
            <div>
              <div class="text-[14px] font-black text-[#0369A1] tracking-wider">Trẻ Em</div>
              <div class="text-[12px] font-medium text-slate-500 mt-0.5">Dưới 12 tuổi</div>
            </div>
            <div class="flex items-center space-x-4">
              <button (click)="updateCount('children', -1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">remove</span>
              </button>
              <span class="text-[16px] font-black w-4 text-center text-slate-900">{{ children }}</span>
              <button (click)="updateCount('children', 1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">add</span>
              </button>
            </div>
          </div>

          <!-- Rooms -->
          <div class="flex items-center justify-between border-t border-sky-100 pt-5">
            <div>
              <div class="text-[14px] font-black text-[#0369A1] tracking-wider">Số Phòng</div>
              <div class="text-[12px] font-medium text-slate-500 mt-0.5">Tối đa 5 phòng</div>
            </div>
            <div class="flex items-center space-x-4">
              <button (click)="updateCount('rooms', -1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">remove</span>
              </button>
              <span class="text-[16px] font-black w-4 text-center text-slate-900">{{ rooms }}</span>
              <button (click)="updateCount('rooms', 1)" class="w-8 h-8 rounded-full border-2 border-sky-200 text-[#0284C7] hover:bg-[#0284C7] hover:text-white hover:border-[#0284C7] transition-all flex items-center justify-center cursor-pointer font-bold">
                <span class="material-symbols-outlined text-[16px]">add</span>
              </button>
            </div>
          </div>

          <button
            (click)="isGuestDropdownOpen = false"
            class="w-full bg-gradient-to-r from-[#EA580C] to-[#f97316] hover:from-[#f97316] hover:to-[#fb923c] transition-all py-3.5 rounded-full text-[12px] font-black text-white uppercase tracking-widest mt-2 cursor-pointer shadow-lg shadow-orange-500/30"
          >
            LƯU TÙY CHỌN
          </button>
        </div>
      </div>

      <!-- Action Button (2 cols) -->
      <div class="lg:col-span-2 flex flex-col justify-center px-2 lg:px-0">
        <button
          type="button"
          (click)="onSearch()"
          class="w-full bg-gradient-to-r from-[#EA580C] to-[#f97316] hover:from-[#f97316] hover:to-[#fb923c] py-4 lg:py-5 px-6 rounded-sm font-black text-[13px] uppercase tracking-[0.2em] text-white flex items-center justify-center transition-all duration-300 shadow-xl shadow-orange-500/40 cursor-pointer"
        >
          <span>TÌM PHÒNG</span>
        </button>
      </div>

    </div>
  </div>

</div>
