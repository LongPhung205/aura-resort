<section id="customer-categories" class="bg-white text-slate-800 pt-28 pb-20 border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header: Clean Editorial Title -->
    <div class="max-w-3xl mx-auto text-center mb-12">
      <div class="inline-flex items-center space-x-1.5 text-xs font-bold tracking-[0.2em] text-amber-900 uppercase mb-3 bg-amber-50 border border-amber-200 px-3.5 py-1.5 rounded-full shadow-sm">
        <span class="material-symbols-outlined text-[16px] text-amber-700">category</span>
        <span>CÁC THỂ LOẠI NGHỈ DƯỠNG KHÁCH HÀNG</span>
      </div>
      <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-900 tracking-tight leading-tight mb-4">
        Lựa Chọn Kỳ Nghỉ Lý Tưởng Của Bạn
      </h2>
      <div class="w-16 h-1 bg-amber-800 mx-auto mb-4 rounded-full"></div>
      <p class="text-sm sm:text-base text-slate-600 font-normal max-w-2xl mx-auto leading-relaxed">
        Khám phá các không gian lưu trú được thiết kế riêng biệt cho từng trải nghiệm nghỉ dưỡng hoàn hảo.
      </p>
    </div>

    <!-- 4 Visual Customer Category Photo Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-7">
      
      <button
        type="button"
        *ngFor="let item of customerCategories; let i = index"
        (click)="onSelectCategory()"
        class="relative h-96 sm:h-[420px] rounded-2xl overflow-hidden group shadow-md hover:shadow-2xl transition-all duration-500 cursor-pointer border border-slate-200 hover:border-amber-400 hover:-translate-y-2 flex flex-col justify-between text-left w-full focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
        <!-- Full-bleed background photo -->
        <img
          [src]="item.imageUrl"
          [alt]="item.name"
          class="absolute inset-0 w-full h-full object-cover group-hover:scale-108 transition-transform duration-700"
        />

        <!-- Top & Bottom Gradient Protection for 100% crisp typography -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/65 via-black/15 to-transparent h-1/3"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-transparent top-1/3"></div>

        <!-- Top Header: Badge & Glass Icon -->
        <div class="relative z-10 p-4 sm:p-5 flex items-center justify-between w-full">
          <span class="text-[10px] font-black tracking-widest px-3 py-1 rounded-md bg-white/95 text-slate-900 uppercase shadow-sm border border-slate-200">
            No. 0{{ i + 1 }} • {{ item.badge }}
          </span>

          <div class="w-9 h-9 rounded-xl bg-white/95 backdrop-blur-md border border-slate-200 flex items-center justify-center text-amber-800 shadow-md">
            <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
          </div>
        </div>

        <!-- Bottom Footer: Category Title & Explore -->
        <div class="relative z-10 p-5 sm:p-6 w-full">
          <div class="text-[11px] font-bold text-amber-300 tracking-[0.18em] uppercase mb-1 drop-shadow-sm">
            {{ item.subtitle }}
          </div>
          <h3 class="text-xl sm:text-2xl font-black text-white leading-tight drop-shadow-md group-hover:text-amber-200 transition-colors">
            {{ item.name }}
          </h3>

          <div class="mt-4 pt-3 border-t border-white/20 flex items-center justify-between text-xs font-bold text-white/90 group-hover:text-white">
            <span>Khám phá bộ sưu tập</span>
            <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1.5 transition-transform">arrow_forward</span>
          </div>
        </div>

      </button>

    </div>

  </div>
</section>
