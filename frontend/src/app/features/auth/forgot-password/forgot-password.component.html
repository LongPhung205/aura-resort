<div class="w-full bg-slate-50 flex flex-col font-sans text-slate-800 relative py-2 lg:py-4 min-h-[calc(100vh-130px)] justify-center">

  <!-- Custom Toast Notification -->
  <div *ngIf="notification.show"
       class="fixed top-24 right-6 z-[9999] flex items-center p-4 min-w-[320px] max-w-sm rounded-2xl shadow-2xl backdrop-blur-xl border border-white/20 overflow-hidden toast-animate-in group"
       [ngClass]="{
         'bg-emerald-600/90 text-white shadow-emerald-600/30': notification.type === 'success',
         'bg-rose-600/90 text-white shadow-rose-600/30': notification.type === 'error',
         'bg-amber-500/90 text-white shadow-amber-500/30': notification.type === 'warning'
       }"
       role="alert">
    
    <!-- Progress Bar -->
    <div class="absolute bottom-0 left-0 h-1 bg-white/40 toast-progress"></div>

    <!-- Icon -->
    <div class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-full bg-white/20 shadow-inner">
      <svg *ngIf="notification.type === 'success'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
      <svg *ngIf="notification.type === 'error'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      <svg *ngIf="notification.type === 'warning'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
    </div>
    
    <!-- Message -->
    <div class="ml-4 mr-6 flex flex-col justify-center">
      <div class="text-[14px] font-semibold text-white leading-snug">
        {{ notification.message }}
      </div>
    </div>
    
    <!-- Close Button -->
    <button type="button" (click)="notification.show = false" class="ml-auto -mx-1.5 -my-1.5 rounded-full focus:ring-2 p-1.5 inline-flex h-8 w-8 text-white/70 hover:text-white hover:bg-white/20 transition-all opacity-0 group-hover:opacity-100">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
    </button>
  </div>

  <div
    class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-center justify-center px-4 lg:px-8 min-h-0">
    <!-- LEFT COLUMN -->
    <div class="hidden lg:flex lg:w-1/2 h-full flex-col justify-center">
      <img src="/assets/images/logologin/1742110359884485918965472479566268397447068n-16716986493441931749227.jpg"
           alt="Aura Login Logo" 
           class="w-full h-auto max-h-[550px] object-cover rounded-[32px] shadow-2xl" />
    </div>

    <!-- RIGHT COLUMN (FORGOT PASSWORD FORM) -->
    <div class="w-full lg:w-1/2 flex items-center justify-center h-full">
      <div
        class="w-full max-w-md bg-white border border-slate-100 shadow-xl shadow-slate-200/50 rounded-2xl p-6 flex flex-col justify-center text-slate-800 mx-auto lg:mx-0 my-auto">
        <div class="text-center mb-5 mt-0">
          <h2 class="text-2xl lg:text-[26px] font-bold text-slate-800 mb-1.5 tracking-tight">Khôi Phục Mật Khẩu</h2>
          <p class="text-slate-500 text-xs px-2" *ngIf="step === 1">
            Vui lòng nhập địa chỉ email của bạn, chúng tôi sẽ gửi một mã OTP để đặt lại mật khẩu.
          </p>
          <p class="text-slate-500 text-xs px-2" *ngIf="step === 2">
            Mã xác thực đã được gửi tới <strong>{{emailForReset}}</strong>. Vui lòng kiểm tra hộp thư.
          </p>
        </div>

        <!-- STEP 1: REQUEST OTP -->
        <form *ngIf="step === 1" [formGroup]="requestOtpForm" (ngSubmit)="requestOtp()" class="flex flex-col flex-1">
          <div class="mb-6">
            <label for="email" class="text-[12px] font-semibold text-slate-700 mb-1.5 block">Email đăng ký</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <!-- Envelope Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-slate-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
              </div>
              <input id="email" type="email" formControlName="email" placeholder="Nhập địa chỉ email"
                class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 text-[13px] focus:border-brand-ocean focus:ring-1 focus:ring-brand-ocean outline-none transition-all" />
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center justify-between mt-auto">
            <a routerLink="/login" class="text-[12px] font-semibold text-brand-ocean hover:text-[#0369A1] transition-colors">Quay lại đăng nhập</a>
            <button type="submit" [disabled]="requestOtpForm.invalid"
              class="bg-brand-ocean text-white text-[13px] font-bold px-6 py-2.5 rounded-lg hover:bg-[#0369A1] transition-colors disabled:opacity-70 disabled:hover:bg-brand-ocean shadow-sm shadow-brand-ocean/30">
              Nhận mã OTP
            </button>
          </div>
        </form>

        <!-- STEP 2: VERIFY OTP AND RESET PASSWORD -->
        <form *ngIf="step === 2" [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="flex flex-col flex-1">
          <!-- OTP -->
          <div class="mb-4">
            <label for="otp" class="text-[12px] font-semibold text-slate-700 mb-1.5 block">Mã xác thực (OTP)</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <!-- Shield Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-slate-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                </svg>
              </div>
              <input id="otp" type="text" formControlName="otp" placeholder="Nhập mã 6 số từ email"
                class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 text-[13px] focus:border-brand-ocean focus:ring-1 focus:ring-brand-ocean outline-none transition-all" />
            </div>
          </div>

          <!-- New Password -->
          <div class="mb-4">
            <label for="newPassword" class="text-[12px] font-semibold text-slate-700 mb-1.5 block">Mật khẩu mới</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <!-- Lock Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-slate-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
              </div>
              <input id="newPassword" type="password" formControlName="newPassword" placeholder="Nhập mật khẩu mới"
                class="w-full pl-10 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 text-[13px] focus:border-brand-ocean focus:ring-1 focus:ring-brand-ocean outline-none transition-all" />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-6">
            <label for="confirmPassword" class="text-[12px] font-semibold text-slate-700 mb-1.5 block">Xác nhận mật khẩu mới</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <!-- Lock Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-slate-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
              </div>
              <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu mới"
                class="w-full pl-10 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 text-[13px] focus:border-brand-ocean focus:ring-1 focus:ring-brand-ocean outline-none transition-all" />
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center justify-between mt-auto">
            <button type="button" (click)="step = 1" class="text-[12px] font-semibold text-slate-500 hover:text-slate-700 transition-colors">Quay lại</button>
            <button type="submit" [disabled]="resetPasswordForm.invalid"
              class="bg-brand-ocean text-white text-[13px] font-bold px-6 py-2.5 rounded-lg hover:bg-[#0369A1] transition-colors disabled:opacity-70 disabled:hover:bg-brand-ocean shadow-sm shadow-brand-ocean/30">
              Đổi mật khẩu
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
