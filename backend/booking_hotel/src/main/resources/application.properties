spring.application.name=booking_hotel
server.port=8080

# Import local developer properties if present (ignored by git)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotel_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}

server.servlet.context-path=/api/v1

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# MoMo Sandbox Credentials
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.partner-code=${MOMO_PARTNER_CODE:MOMOBKUN20180529}
momo.access-key=${MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}
momo.secret-key=${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/api/v1/payments/momo-return}
momo.frontend-url=${MOMO_FRONTEND_URL:http://localhost:4200/payment/momo-result}
momo.ipn-url=${MOMO_IPN_URL:https://webhook.site/momo-ipn-dummy}
momo.request-type=${MOMO_REQUEST_TYPE:payWithCC}

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile

app.otp.expiration=5

# Spring Data Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Ollama Configuration
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.temperature=0.1

app.upload-dir=${APP_UPLOAD_DIR:/app/uploads}
