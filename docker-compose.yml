version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel_booking_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 10092005Long
      MYSQL_DATABASE: hotel_booking_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel_booking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotel_network

  backend:
    build:
      context: ./backend/booking_hotel
      dockerfile: Dockerfile
    container_name: hotel_booking_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hotel_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=10092005Long
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "8080:8080"
    networks:
      - hotel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_booking_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hotel_network

networks:
  hotel_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
